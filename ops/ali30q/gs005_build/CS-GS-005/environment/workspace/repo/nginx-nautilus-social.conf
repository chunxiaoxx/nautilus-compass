server {
    listen 80;
    server_name nautilus.social www.nautilus.social;
    return 301 https://$server_name$request_uri;
}

server {
    listen 8443 ssl;
    ssl_certificate /etc/letsencrypt/live/nautilus.social/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nautilus.social/privkey.pem;
    server_name nautilus.social www.nautilus.social;

    # 2026-10-11 sourcemap 封堵(compass #10973: 源码暴露面)
    # 2026-10-11 后缀级止血(compass #11040: 双root窗口期备份/临时/映射/凭据类后缀封口,独立可回滚)
    location ~* \\.(bak|swp|orig|old|save|tmp|sql|env|log|map)$ { return 404; }
    location ~* \.map$ { return 404; }


    # vertex express 反代（2026-10-14 · 剥 new-api 顶层 thinking，key 由本地 relay 注入）
    location /vertex-expr-686f1d59c1766199/ {
        proxy_pass http://127.0.0.1:8897/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }
    location /api/judge_status {
        proxy_pass http://127.0.0.1:9890;
    }

    location = /criteria {
        return 301 https://nautilus.social/criteria/;
    }

    location = /phase3_expert_ops {
        return 301 https://fde.nautilus.social/phase3_expert_ops/;
    }

    location ^~ /phase3_expert_ops/ {
        return 301 https://fde.nautilus.social$request_uri;
    }

    location = /phase3_ops {
        return 301 https://fde.nautilus.social/phase3_ops/;
    }

    location ^~ /phase3_ops/ {
        return 301 https://fde.nautilus.social$request_uri;
    }

    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/feishu-oauth-callback.conf;

    # MinerU PDF 解析（本地 1060Ti GPU，反向 SSH 隧道转发）
    location /api/feishu/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /api/mineru/ {
        rewrite ^/api/mineru/(.*) /$1 break;
        proxy_pass http://127.0.0.1:18095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 50M;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Gemini 反代（给上海 vc-radar 等国内服务调用 Google API）
    location /api/gemini-proxy/v1/projects/ {
        rewrite ^/api/gemini-proxy/(.*) /$1 break;
        proxy_pass https://us-central1-aiplatform.googleapis.com;
        proxy_set_header Host us-central1-aiplatform.googleapis.com;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /api/gemini-proxy/ {
        rewrite ^/api/gemini-proxy/(.*) /$1 break;
        proxy_pass https://generativelanguage.googleapis.com;
        proxy_set_header Host generativelanguage.googleapis.com;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /api/gemini-oauth/ {
        rewrite ^/api/gemini-oauth/(.*) /$1 break;
        proxy_pass https://oauth2.googleapis.com;
        proxy_set_header Host oauth2.googleapis.com;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_buffering off;
    }

    # MCP Protocol Server
    # Compass standard-remote MCP (compass-mcp-http.service · 8097)
    location /assay/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:18890;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /compass-mcp/ {
        proxy_pass http://127.0.0.1:8097/mcp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # MCP Protocol Server (nautilus-engine · 8096) · 2026-09-10 activation:
    # backend only serves POST /mcp (no trailing slash); the /mcp/ prefix below
    # alone left /mcp unmatched (fell through → 301/404). Exact-match location
    # added; mirrors the compass-mcp block's header set (9/10 platform
    # activation day · canonical copy of this file lives in ops/nginx/).
    location = /mcp {
        proxy_pass http://127.0.0.1:8096/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /mcp/ {
        proxy_pass http://127.0.0.1:8096/mcp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # V5 HTML & API · 2026-04-24
    location = /onboard { proxy_pass http://localhost:8001/onboard; proxy_set_header Host $host; }
    location /health  { proxy_pass http://localhost:8001/health;  proxy_set_header Host $host; }
    location = /login { rewrite ^ /login.html last; }
    location = /register { rewrite ^ /login.html last; }
    location = /onboarding-spec.md { root /var/www/nautilus/current; default_type text/markdown; charset utf-8; }
    location = /api/openapi.json { proxy_pass http://localhost:8000/api/openapi.json; proxy_set_header Host $host; }
    location = /api/docs        { proxy_pass http://localhost:8000/api/docs;        proxy_set_header Host $host; }
    location /api/health  { proxy_pass http://localhost:8000/health;  proxy_set_header Host $host; }
    location /a2a     { proxy_pass http://localhost:8001/a2a;     proxy_set_header Host $host; }
    location /p/      { proxy_pass http://localhost:8001;         proxy_set_header Host $host; }
    location /blog    { proxy_pass http://localhost:8001; proxy_set_header Host $host; }
    location /posts   { proxy_pass http://localhost:8001;         proxy_set_header Host $host; }
    location /v1/     { proxy_pass http://localhost:8001;         proxy_set_header Host $host; proxy_read_timeout 120s; }
    location /.well-known/ { proxy_pass http://localhost:8001;    proxy_set_header Host $host; }
    # A2A AgentCard (spec v1.0.0) · phase3 backend (:8000) — exact match wins over
    # the V5 /.well-known/ prefix block above. 2026-09-12 protocol alignment.
    location = /.well-known/agent-card.json {
        proxy_pass http://localhost:8000/.well-known/agent-card.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /feed     { proxy_pass http://localhost:8001; proxy_set_header Host $host; proxy_buffering off; proxy_read_timeout 600s; }
    location /api/dir/ { proxy_pass http://localhost:8001; proxy_set_header Host $host; }
    location /api/pearl/ { proxy_pass http://localhost:8001; proxy_set_header Host $host; }
    location /api/acp/   { proxy_pass http://localhost:8001; proxy_set_header Host $host; }
    location /lineage/   { proxy_pass http://localhost:8001; proxy_set_header Host $host; }
    location /skills      { proxy_pass http://localhost:8001; proxy_set_header Host $host; }
    location /rules      { proxy_pass http://localhost:8001; proxy_set_header Host $host; }
    location /services    { proxy_pass http://localhost:8001; proxy_set_header Host $host; }
    location /api/lineage/ { proxy_pass http://localhost:8001; proxy_set_header Host $host; }
    # 2026-05-05 加 phase3 backend (:8000) 真反代 · 解决外网 404
    # /api/* 默认走 V5 :8001 · 但 phase3 backend 的 prefix 显式映射到 :8000
    # 2026-09-10 activation: a2a added — /api/a2a/* (relay send/inbox/agents)
    # previously fell through to the :8001 catch-all below → 404, which was the
    # "A2A relay 未证实" card on the 9/9 mechanism map.
    location = /api/platform/feed { proxy_pass http://localhost:8001/api/platform/feed; proxy_http_version 1.1; proxy_set_header Host $host; proxy_buffering off; proxy_read_timeout 600s; }
    # 2026-10-10 收敛(SITE_AUDIT_20261010 #2): 旧版白皮书/BP 路径 301 到 v1.7 正本(/org/),防双版本口径漂移
    # port_in_redirect off: 8443 内口不外泄,Location 拼标准 443 形态(否则 301 断链)
    port_in_redirect off;
    location = /whitepaper { return 301 /org/whitepaper.html; }
    location ^~ /whitepaper/ { return 301 /org/whitepaper.html; }
    location = /bp { return 301 /org/business-plan.html; }
    location ^~ /bp/ { return 301 /org/business-plan.html; }
    # 2026-10-09 止血(compass #10854/#10861/#10884 · #10862 承诺·今夜维护窗): bootstrap 付费自改进
    # 循环口及孪生 bootstrap-loop 口不对公网(前缀覆盖两者;应用层鉴权白窗部署=纵深第二层)。
    # 2026-10-12 P0修复(#11085): .json 从 legacy 树解析——UNIFY root 切换后判读API/语料计数断链回归
    location = /corpus_stats.json { root /var/www/nautilus/current; }
    # 2026-10-14 收窄(#11175): 整树.json$全开→语料计数白名单,其余确定性404
    # (agent-card/site_stats 由上方精确/^~ location 先行,不受影响)
    location ~* \\.json$ { return 404; }
    # 2026-10-14 收口(#11163): 三bot webhook 前缀确定性404(200兜底页会让上游误判投递成功)
    location ~ ^/(telegram|admin-bot|commerce-bot)(/|$) { return 404; }
    # 2026-10-12 P0修复续(#11085): criteria 判据页目录从 legacy 树解析
    location ^~ /submit/ { root /var/www/nautilus/current; }
    location ^~ /org/ { root /var/www/nautilus/current; }
    location ^~ /products/ { root /var/www/nautilus/current; }
    location ^~ /auth/ { root /var/www/nautilus/current; }
    location ^~ /criteria/ { root /var/www/nautilus/current; try_files $uri $uri/ /criteria/index.html; }
    location ~ ^/api/bootstrap {
        return 403;
    }
    # 2026-10-10 CORS(app域SPA消费主域API;compass #10913遗留的跨域断链正解之一)
    add_header Access-Control-Allow-Origin "https://app.nautilus.social" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key, X-Writeback-Key" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    location ~ ^/api/(a2a|v1|wechat|wecom|feed|hub|agents|tasks|auth|wallets|leaderboard|marketplace|academic|dashboard|agent-first|agent-market|memory|bootstrap|survival|anti-cheat|alerts|rewards|labeling|raid|payments|skills|skill-library|openclaw|teams|simulation|discover|mcp|platform|stats|kairos|v7|agents-unified|soul|square|users) {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /api/ {
        proxy_pass http://localhost:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Compass landing - 2026-05-06 - cross-agent memory layer
    location = /compass { return 301 /compass/; }
    location ^~ /compass/ {
        alias /var/www/nautilus/compass/;
        index index.html;
        add_header Cache-Control "public, max-age=300" always;
    }

    location /org/evidence/ { alias /home/ubuntu/nautilus-mvp/phase3/backend/docs/evidence/supervisor/; add_header Cache-Control "no-store"; }
    root /var/www/nautilus/current;

    location ~ \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # 2026-10-10 全站统一基座: 主站根路径=app 同一确定版 SPA(4月版),功能页location全保留
    # 2026-10-11 UNIFY 2.1: bench数据同源化(主域反代bench域,SPA免CORS)
    location ^~ /data/site_stats.json {
        proxy_pass https://127.0.0.1:8443/data/site_stats.json;
        proxy_ssl_server_name on;
        proxy_set_header Host bench.nautilus.social;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        root /var/www/app;
        try_files $uri $uri/ /index.html;
    }
}
