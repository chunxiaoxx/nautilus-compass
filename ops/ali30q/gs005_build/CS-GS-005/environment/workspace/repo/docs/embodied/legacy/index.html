<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>具身数据线 · 历史版本归档</title>
  <style>
    :root {
      --bg: #f3f6fc;
      --ink: #122235;
      --muted: #5f7387;
      --line: #d9e4f2;
      --brand: #1d4ed8;
      --radius: 14px;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC","Microsoft YaHei","Noto Sans SC",Arial,sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }
    h1 { margin: 0 0 10px; font-size: 36px; line-height: 1.2; }
    h2 { margin: 0 0 10px; font-size: 22px; color: #1f3c58; }
    .lead { color: var(--muted); font-size: 16px; }
    .links { margin-top: 14px; display: grid; gap: 10px; }
    .links a {
      display: block;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--brand);
      text-decoration: none;
      font-weight: 600;
    }
    .links a:hover {
      background: #f8fbff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <h1>具身数据线 · 历史版本归档</h1>
      <p class="lead">这里保留了之前做的版本，不是替换，而是便于比对回退。</p>
      <div class="links">
        <a href="/embodied/legacy/landing.html" target="_blank">3Day 早期作战主页</a>
        <a href="/embodied/legacy/cockpit.html" target="_blank">3Day Cockpit（旧视图）</a>
        <a href="/embodied/team/" target="_blank">team（历史旧页）</a>
        <a href="/embodied/public/" target="_blank">public（唯一外发能力页）</a>
        <a href="/embodied/pilot/" target="_blank">pilot（旧生成式演示）</a>
        <a href="/embodied/public/" target="_blank">回到当前外发聚合版</a>
      </div>
    </section>
  </div>
</body>
</html>
