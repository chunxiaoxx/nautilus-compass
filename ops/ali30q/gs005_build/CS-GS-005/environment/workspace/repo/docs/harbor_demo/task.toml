schema_version = "1.3"
artifacts = ["/logs/artifacts"]

[task]
name = "tasks/<your-task-id>"                    # 替换为实际 task ID（与目录名一致）
description = "<one-line description>"            # 一句话描述任务目标
authors = [{ name = "nius" }]
keywords = []                                     # 例: ["python", "bug-fix", "concurrency"]

[metadata]
domain = ""                                       # 领域: infrastructure / compiler / framework / ...
task_type = ""                                    # 类型: bug-fix / feature / refactor / ...
language = ""                                     # 主语言: go / python / java / rust / ...
difficulty = "medium"                             # easy / medium / hard
knowledge_path = "计算产品/编程语言与编译器/编译器前端/语法分析与错误诊断"   # 知识点路径
knowledge_l0 = "计算产品"   
knowledge_l1 = "编程语言与编译器"   # 知识树一级分类
knowledge_l2 = "编译器前端"       # 知识树二级分类
knowledge_l3 = "语法分析与错误诊断" # 知识树三级分类
tags = ["编程语言与编译器", "编译器前端", "语法分析与错误诊断", "递归下降解析器", "YAML", "位置信息与诊断"]

[verifier]
timeout_sec = 1800.0

[verifier.env]

[agent]
timeout_sec = 7200.0

[environment]
network_mode = "public"                           # public / no-network / allowlist
build_timeout_sec = 600.0
os = "linux"
mcp_servers = []
cpus = 2
memory = "4g"
storage = "10g"


[environment.env]

