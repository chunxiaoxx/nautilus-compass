# org workbench v0 · 2026-08-30 · docs/plans/2026-08-29-org-workbench-design.md
# 部署形态(实测定型):
#   页面+台账 → /var/www/nautilus/current/org/(index.html + asset-ledger.md),
#               复用现有 SPA location /,零新增 location(alias+index 在 nginx 1.18 有坑,已绕开)
#   生产活体数据 → 下方 evidence alias 直读云仓 supervisor 产出(唯一保留的 location)
# 迁移 org.nautilus.social 时: evidence alias 拷入新 server 块 + root 指向同目录即可(API 同机反代同源)

    location /org/evidence/ { alias /home/ubuntu/nautilus-mvp/phase3/backend/docs/evidence/supervisor/; add_header Cache-Control "no-store"; }
