# org.nautilus.social · 组织驾驶舱正席(2026-08-30)
# 证书: acme.sh DNS 验证签发,--install-cert 落 /etc/nginx/ssl-org/,续期自动 reload
# 部署: 放 /etc/nginx/sites-available/org,ln -s 到 sites-enabled
server {
    listen 80;
    server_name org.nautilus.social;

    root /var/www/nautilus/current/org;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /evidence/ {
        alias /home/ubuntu/nautilus-mvp/phase3/backend/docs/evidence/supervisor/;
        add_header Cache-Control "no-store";
    }
}

server {
    listen 443 ssl;
    server_name org.nautilus.social;

    ssl_certificate /etc/nginx/ssl-org/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl-org/key.pem;

    root /var/www/nautilus/current/org;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /evidence/ {
        alias /home/ubuntu/nautilus-mvp/phase3/backend/docs/evidence/supervisor/;
        add_header Cache-Control "no-store";
    }
}
