server {
    listen 80;
    server_name app.nautilus.social;
    # 2026-10-11 sourcemap 封堵(compass #10973: 源码暴露面)
    location ~* \.map$ { return 404; }
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 8443 ssl;
    server_name app.nautilus.social;
    ssl_certificate /home/ubuntu/.acme.sh/app.nautilus.social_ecc/fullchain.cer;
    ssl_certificate_key /home/ubuntu/.acme.sh/app.nautilus.social_ecc/app.nautilus.social.key;
    root /var/www/app;
    index index.html;
    location ~ ^/api/(bootstrap|payments|alerts|claude|labeling|raid|simulation|teams|discover|skills|skill-library|wechat|wecom|kairos|v7|agents-unified|soul|gemini|mineru|feishu|dir|pearl|acp|lineage) {
        return 403;
    }
    location ~ ^/api/(auth|users|tasks|agents|marketplace|platform|v1|openclaw|a2a|academic|agent-first|stats|dashboard|rewards|metrics|survival|wallets|agent-market|square|genes) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /api/ { return 403; }
    location ~* \.map$ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
