schema_version = "1.4"

[[artifacts]]
source = "environment/workspace/repo"
destination = "/workspace/repo"

[task]
name = "guoshu/codesense-cs-019"
description = "Code Sense · 探针缺键静默默认(监控盲区漏报)· 浅中档单坑语义评测题"

[[task.authors]]
name = "上海国曙智能"

[agent]
timeout_sec = 1800
network_mode = "no-network"

[verifier]
timeout_sec = 900
