[environment]
build_timeout_sec = 900
network_mode = "no-network"
os = "linux"
cpus = 2
memory_mb = 4096

[metadata]
badpattern = "F05.02 边界与异常处理缺陷 + 第11行 明确需求或约束遗漏"
Domain = "D01.1 后端接口与业务逻辑"
id = "CS-019"
pool = "ali-codesense-30q"
batch = "C"
seed = "S0探针缺键默认值"
producer = "platform"
