network_mode = "no-network"
os = "linux"
cpus = 2
memory_mb = 4096

[metadata]
id = "CS-P101"
badpattern = "P1 口标理解错误 × D01.1 后端接口与业务逻辑"
focus_points = "①执行语义与状态追踪, ④语言/运行时语义边界, ⑥约束理解与tradeoff判断"
pool = "ali-codesense-30q"
batch = "P1P6-14"
producer = "platform"
