schema_version = "1.4"

[[artifacts]]
source = "environment/workspace/repo"
destination = "/workspace/repo"

[task]
name = "guoshu/codesense-cs-p101"
description = "Code Sense · P1口径理解错×D01.1(退款快照/单位/尾差三坑+反幻觉备注)· 中档语义评测题"

[[task.authors]]
name = "上海国曙智能"

[agent]
