python3 - <<'PYEOF'
import sys, importlib.util
spec = importlib.util.spec_from_file_location('t', 'tests/test_csp701.py')
t = importlib.util.module_from_spec(spec); sys.modules['t']=t; spec.loader.exec_module(t)
sys.path = [p for p in sys.path if 'environment/workspace/repo' not in p]
for m in [k for k in list(sys.modules) if k.startswith('alert_dispatch')]: del sys.modules[m]
sys.path.insert(0,'solution')
import alert_dispatch as gold
t.dispatch_alert = gold.dispatch_alert
fns=[(n,f) for n,f in vars(t).items() if n.startswith('test_') and callable(f)]
ok=0; fails=[]
for n,f in fns:
    try: f(); ok+=1
    except Exception as e: fails.append((n,str(e)[:40]))
print(f'金标: {ok}/{len(fns)}', '全过✓' if not fails else fails)
PYEOF
