server {
    server_name fde.nautilus.social;
    port_in_redirect off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Let's Encrypt ACME challenge 路径
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 静态站 (与主站共享前端发布目录)
    root /var/www/fde.nautilus.social;

    # 专用运营包短链（精确跳转，避免 if 稳定性问题）
    location = /phase3_expert_ops/01_RECRUITING_KIT.md {
        return 302 /phase3_expert_ops/?scene=scene-recruiting;
    }

    location = /phase3_expert_ops/02_EXPERT_ONBOARDING.md {
        return 302 /phase3_expert_ops/?scene=scene-onboarding;
    }

    location = /phase3_expert_ops/03_OPERATOR_SOP.md {
        return 302 /phase3_expert_ops/?scene=scene-ops;
    }

    # 专用运营包落地页（避免 SPA 回退/缓存误导）
    location /phase3_expert_ops {
        return 301 /phase3_expert_ops/;
    }

    location /phase3_expert_ops/ {
        root /var/www/fde.nautilus.social;
        index index.html;
        charset utf-8;
        default_type text/html;
        types { text/html .md; }
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Route "phase3-ops" always;
        add_header X-Route "phase3-expert" always;
        add_header X-Server-Name "fde.nautilus.social" always;
    }

    location /phase3_ops {
        return 301 /phase3_ops/;
    }

    location /phase3_ops/ {
        root /var/www/fde.nautilus.social;
        index index.html;
        charset utf-8;
        default_type text/html;
        types { text/html .md; }
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Server-Name "fde.nautilus.social" always;
    }

    # API 透传（与主站一致）
    # 2026-10-10 P0止血(compass #10913 §6): 危险前缀不对公网——app域同款名单+google/research实测裸面
    # 2026-10-14 P0收口(#11120/#11163): 训练资产/脚本类后缀不对公网(关目录listing≠关文件)
    location ~* \\.(py|pyc|sh|log|db|sqlite|env|bak|sql)$ { return 404; }
    location ~ ^/api/(bootstrap|google|multimodal|research|claude|labeling|raid|simulation|teams|discover|skills|skill-library|alerts|payments|kairos|v7|agents-unified|soul|gemini|mineru|feishu|wechat|wecom|dashboard) {
        return 403;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
        index index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Route "main" always;
        add_header X-Server-Name "fde.nautilus.social" always;
    }

    # FDE Phase3 页面统一指向主站前端
    # 让 https://fde.nautilus.social/docs/fde-phase3 落到主站同一套可运行页面
    location = /docs/fde-phase3 {
        return 302 /docs/fde-phase3/;
    }

    location = /docs/fde-phase3/ {
        return 302 https://www.nautilus.social/docs/fde-phase3;
    }

    # webhook 反代 (FastAPI uvicorn)
    location /webhook/ {
        proxy_pass http://webhook_backend/webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 客户端 IP / 签名 header 透传 (HMAC 验签用)
        proxy_set_header X-Lark-Signature $http_x_lark_signature;
        proxy_set_header X-Lark-Timestamp $http_x_lark_timestamp;

        # Webhook 通常瞬时, 短 timeout
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
    }

    # 健康检查透传
    location /onboard/ {
        proxy_pass http://127.0.0.1:8850/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8848/healthz;
        access_log off;
    }

    # Playground 反代 (2026-06-16 added)
    location /playground/ {
        proxy_pass http://127.0.0.1:8849/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 调研库整目录免登录(公开调研内容) + 指挥台落地页 -- 2026-08-30
    location = /console/research {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
    }
    location /console/research/ {
        # auth_basic 恢复 2026-10-10 泄密止血(guest/research 免登录口子关闭,见 docs/evidence 审查报告外泄事件)
        auth_basic "Flywheel Team";
        auth_basic_user_file /etc/nginx/.htpasswd-flywheel;
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location /egoumi/ {
        alias /var/www/egoumi/;
        add_header Cache-Control "no-cache";
    }
    location = /egoumi { return 301 /egoumi/; }
    # 一页纸 v0.5 排版页(公开产品材料) -- 2026-08-31
    location /onepager/ {
        alias /var/www/onepager/;
        add_header Cache-Control "no-cache";
    }

    # Guest 只读门户(伙伴演示,独立口令) -- 2026-09-01 / 2026-10-10 泄密止血恢复口令
    location /console/g/ {
        auth_basic "Flywheel Team";
        auth_basic_user_file /etc/nginx/.htpasswd-flywheel;
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Label Studio 标注台(团队,反代8081) -- 2026-09-01
    location /labelstudio/ {
        auth_basic "Flywheel Team";
        # auth_basic_user_file /etc/nginx/.htpasswd-flywheel;
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 200m;
        proxy_read_timeout 300s;
    }

    # Flywheel Console (FastAPI, basic auth) -- deployed 2026-08-30
location /embodied { return 301 https://fde.nautilus.social/console/g/map$is_args$args; }
    location /console/ {
        # auth_basic retired 2026-09-16 Phase1 邮箱验证接管（备份 .bak-authphase1-*）
        # auth_basic_user_file /etc/nginx/.htpasswd-flywheel;
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    listen 8443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/fde.nautilus.social/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fde.nautilus.social/privkey.pem;
    listen [::]:8443 ssl; # managed by Certbot

}

upstream webhook_backend { server 127.0.0.1:8848 max_fails=3 fail_timeout=30s; server 127.0.0.1:8851 max_fails=3 fail_timeout=30s; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name fde.nautilus.social;
    return 301 https://$host$request_uri;
}
