# /etc/nginx/sites-available/compass
# Symlink: ln -s /etc/nginx/sites-available/compass /etc/nginx/sites-enabled/compass
# Apply: sudo nginx -t && sudo systemctl reload nginx
# Cert: sudo certbot --nginx -d compass.nautilus.social

server {
    listen 80;
    server_name compass.nautilus.social;

    # Letsencrypt challenge (before TLS)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS (after first cert issuance)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name compass.nautilus.social;

    ssl_certificate     /etc/letsencrypt/live/compass.nautilus.social/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/compass.nautilus.social/privkey.pem;

    # Static landing page
    location = / {
        root /home/ubuntu/nautilus-compass/landing;
        try_files /index.html =404;
        expires 1h;
    }

    # API endpoints → gateway uvicorn
    location ~ ^/(v1|mcp|healthz|readyz)/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Endpoint without trailing slash
    location ~ ^/(v1|mcp)$ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
    }

    # CORS for landing page demo
    add_header Access-Control-Allow-Origin "https://compass.nautilus.social" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Agent-Key, X-Tenant-ID" always;

    access_log /var/log/nginx/compass-access.log;
    error_log  /var/log/nginx/compass-error.log;
}
