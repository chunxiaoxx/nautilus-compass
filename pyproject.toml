[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nautilus-compass"
version = "2.3.0"
description = "Opinionated EvoMap · cross-agent memory with schema-declared 4-tier lifecycle + Ebbinghaus decay + LLM-free promotion · MCP/A2A · drift-aware · LongMemEval-S 56.6%"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "chunxiaoxx" }
]
keywords = [
    "claude-code", "memory", "persona-vectors", "drift-detection",
    "rag", "embedding", "bge", "agent-memory", "mcp", "a2a",
    "nautilus-platform", "cross-agent", "longmemeval"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "sentence-transformers>=2.7",
]

[project.optional-dependencies]
modelscope = ["modelscope>=1.10"]
rerank = ["sentence-transformers>=2.7"]   # CrossEncoder included
fast-download = ["hf_transfer>=0.1"]
dev = ["pytest>=7", "pytest-cov", "ruff"]
e2ee = ["pynacl>=1.5"]                    # libsodium · v1.0 default
nautilus = ["nautilus-agent>=0.5"]        # platform SDK · v0.9.3 fusion

[project.urls]
Homepage = "https://github.com/chunxiaoxx/nautilus-compass"
Issues = "https://github.com/chunxiaoxx/nautilus-compass/issues"

[project.scripts]
nautilus-compass = "nautilus_compass.cli:main"
compass-mcp = "nautilus_compass.mcp_server:main"
compass-a2a = "nautilus_compass.sdk.a2a_adapter:serve"
compass-drift-history = "nautilus_compass.drift_history:main"
compass-session-search = "nautilus_compass.session_search:main"
compass-session-writer = "nautilus_compass.session_writer:main"

[tool.setuptools]
# v1.6.3 fix: must include sdk/ and middleware/ as subpackages.
# v1.6.2 was broken — only top-level was packaged, so `nautilus_compass.sdk`
# and `nautilus_compass.middleware` imports failed at install time.
# Explicit list (not `find`) avoids setuptools treating tests/, scripts/, etc as packages.
packages = ["nautilus_compass", "nautilus_compass.sdk", "nautilus_compass.middleware", "nautilus_compass.storage", "nautilus_compass.proof", "nautilus_compass.drift", "nautilus_compass.recall_pkg", "nautilus_compass.skills_pkg", "nautilus_compass.judges"]
package-dir = {"nautilus_compass" = ".", "nautilus_compass.sdk" = "sdk", "nautilus_compass.middleware" = "middleware", "nautilus_compass.storage" = "storage", "nautilus_compass.proof" = "proof", "nautilus_compass.drift" = "drift", "nautilus_compass.recall_pkg" = "recall_pkg", "nautilus_compass.skills_pkg" = "skills_pkg", "nautilus_compass.judges" = "judges"}

[tool.setuptools.package-data]
"nautilus_compass" = ["anchors*.json", "*.sh"]
"nautilus_compass.sdk" = ["*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "scripts/_archive",
    ".cache",
    "__pycache__",
    "*.ipynb",  # bench/colab notebooks are not linted as source
]

[tool.ruff.lint]
# Default ruff = pyflakes (F) + pycodestyle errors (E)
# We disable the legacy-style E rules that conflict with the project's
# compact one-line style; we keep the bug-catching F rules.
ignore = [
    "E701",  # multiple statements on one line (colon) · used in compact one-liners
    "E702",  # multiple statements on one line (semicolon) · same
    "E401",  # multiple imports on one line · stdlib batch imports
    "E402",  # module-import-not-at-top · sys.path tweaks before imports
    "E722",  # bare except · used in defensive boundary handlers
    "E731",  # lambda-assignment · used in lookup tables
    "E741",  # ambiguous variable name · l/I/O sometimes domain-natural
    "F541",  # f-string without placeholders · stylistic
    "F841",  # unused variable · often kept for symmetry / future use
]
