[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nautilus-compass"
version = "0.9.0-dev"
description = "Cross-agent memory layer for the Nautilus platform · MCP/A2A protocol · drift-aware writer · LongMemEval-S benchmark · E2EE-ready"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "chunxiaoxx" }
]
keywords = [
    "claude-code", "memory", "persona-vectors", "drift-detection",
    "rag", "embedding", "bge", "agent-memory", "mcp", "a2a",
    "nautilus-platform", "cross-agent", "longmemeval"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "sentence-transformers>=2.7",
]

[project.optional-dependencies]
modelscope = ["modelscope>=1.10"]
rerank = ["sentence-transformers>=2.7"]   # CrossEncoder included
fast-download = ["hf_transfer>=0.1"]
dev = ["pytest>=7", "pytest-cov", "ruff"]
e2ee = ["pynacl>=1.5"]                    # libsodium · v1.0 default
nautilus = ["nautilus-agent>=0.5"]        # platform SDK · v0.9.3 fusion

[project.urls]
Homepage = "https://github.com/chunxiaoxx/nautilus-compass"
Issues = "https://github.com/chunxiaoxx/nautilus-compass/issues"

[project.scripts]
nautilus-compass = "nautilus_compass.cli:main"
compass-mcp = "nautilus_compass.mcp_server:main"
compass-a2a = "nautilus_compass.sdk.a2a_adapter:serve"
compass-drift-history = "nautilus_compass.drift_history:main"
compass-session-search = "nautilus_compass.session_search:main"
compass-session-writer = "nautilus_compass.session_writer:main"

[tool.setuptools]
package-dir = {"nautilus_compass" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["nautilus_compass*"]
exclude = ["tests*", ".cache*"]

[tool.setuptools.package-data]
"nautilus_compass" = ["anchors*.json", "*.sh"]

[tool.ruff]
line-length = 100
target-version = "py39"
