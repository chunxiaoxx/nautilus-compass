name: release

on:
  push:
    tags:
      - "v1.*"   # v1.0.0-rc1, v1.0.0, v1.1.0, etc.

permissions:
  contents: write   # needed to create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history so changelog + tag are both readable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi httpx uvicorn cryptography pyjwt 'python-jose[cryptography]'

      - name: Full pytest sweep (release gate)
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: pytest tests/ -q

      - name: Resolve version from tag
        id: ver
        run: |
          # strip leading "v" · "v1.0.0-rc1" → "1.0.0-rc1"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          case "${GITHUB_REF_NAME}" in
            *-rc*|*-alpha*|*-beta*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)                      echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Extract release notes from CHANGELOG
        run: |
          python scripts/release_notes_extract.py \
            --version "${{ steps.ver.outputs.version }}" \
            --out "release-notes.md"
          echo "---- preview ----"
          head -40 release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "nautilus-compass ${{ steps.ver.outputs.version }}"
          body_path: release-notes.md
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: |
            CHANGELOG.md
            docs/v1.0-checklist.md
            docs/mcp-usage.md
