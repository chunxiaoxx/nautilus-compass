name: Publish to PyPI

# Triggers on every git tag matching v*.*.* (semver releases).
# Builds sdist + wheel, then uploads to PyPI via static API token.
#
# To enable (one-time):
#   1. Generate a PyPI API token scoped to nautilus-compass at
#      https://pypi.org/manage/account/token/
#   2. Add it as repo secret `PYPI_API_TOKEN` at
#      https://github.com/chunxiaoxx/nautilus-compass/settings/secrets/actions
#   3. Push a tag (e.g. `git tag v2.0.0 && git push origin v2.0.0`).
#
# Previous OIDC Trusted Publisher setup deprecated 2026-05-21 due to
# repeated workflow failures (3 consecutive on 18c50ed / aa120e6 / 99b099b).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          verbose: true
