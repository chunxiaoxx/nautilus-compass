name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Cache HF + ModelScope models
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/modelscope
          key: bge-cache-${{ matrix.os }}-${{ hashFiles('install_bge.sh') }}

      - name: Install
        run: |
          pip install -e .[modelscope,fast-download] pytest
          # 用 small-zh 跑 CI · 比 m3 快 20x · 内存 < 200MB
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-small-zh-v1.5')"

      # selftest.py + eval_recall.py both need real user memory data at
      # ~/.claude/projects/C--Users-chunx/memory/*.md which CI runners don't
      # have. We run them on the dev's machine before each release; CI only
      # validates the parts that don't depend on developer-specific data.

      - name: Drift eval (anchors-only · no user data needed)
        run: |
          ZMM_EMBEDDER_MODEL=BAAI/bge-small-zh-v1.5 python tests/eval_drift.py | tee drift.log
          # 校验: AUC 至少 0.65 · CI 用 small-zh 比 m3 弱
          python -c "
          import re
          auc = float(re.search(r'ROC AUC\s*=\s*([\d.]+)', open('drift.log').read()).group(1))
          assert auc >= 0.65, f'AUC regression: {auc}'
          print(f'AUC OK: {auc}')
          "

      - name: GEP flywheel tests
        run: python -m pytest -q tests/gep

      - name: Wheel packaging smoke
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python -m venv "$RUNNER_TEMP/gep-wheel-smoke"
          "$RUNNER_TEMP/gep-wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/gep-wheel-smoke/bin/python" -I -c \
            "import gep.experience_packet, gep.flywheel_event, gep.flywheel_log"

  s4-gep-py39:
    name: S4 GEP minimum Python (3.9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: { python-version: "3.9" }
      - run: pip install pytest
      - run: python -m pytest -q tests/gep

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check .

  v09-integration:
    name: v0.9 integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -e .
      - name: Run v0.9 integration tests
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python tests/test_compass_v09.py
      - name: A2A adapter selftest
        run: python sdk/a2a_adapter.py selftest

  v10-mcp-smoke:
    name: v1.0 MCP server (10 tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: MCP initialize + tools/list
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "
          import json, subprocess
          p = subprocess.Popen(['python', 'mcp_server.py'],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True, encoding='utf-8')
          out, _ = p.communicate(
              input=json.dumps({'jsonrpc':'2.0','id':1,'method':'initialize','params':{}}) + '\n' +
                    json.dumps({'jsonrpc':'2.0','id':2,'method':'tools/list','params':{}}) + '\n',
              timeout=15)
          tools = []
          for line in out.splitlines():
              try:
                  d = json.loads(line)
                  if 'tools' in d.get('result', {}):
                      tools = [t['name'] for t in d['result']['tools']]
              except: pass
          # 7 stable v0.9 tools must be present; v1.0 added long_task/submit_platform_task/ingest_platform_task_result.
          REQUIRED = {'recall', 'drift_check', 'ingest_obs', 'drift_history', 'session_search', 'profile', 'feedback_log'}
          missing = REQUIRED - set(tools)
          assert not missing, f'missing required tools: {missing} (got: {tools})'
          assert len(tools) >= 7, f'expected >=7 tools, got {len(tools)}: {tools}'
          print(f'OK: {len(tools)} tools · {tools}')"

  v09-npm-wrapper:
    name: v0.9 npm wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v6
        with: { node-version: "20" }
      - run: pip install -e .
      - run: cd npm && node bin/cli.js --selftest

  v09-cursor-extension:
    name: v0.9 Cursor extension build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "20" }
      - run: cd cursor-extension && npm install && npm run compile

  v10-protocol-tests:
    name: v1.0 MCP + A2A protocol pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e . pytest
      - name: MCP + A2A + GEP unit tests
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: pytest tests/test_mcp_server.py tests/test_a2a_adapter.py tests/test_merkle_chain.py tests/gep -q

  v10-v7-governance-smoke:
    name: v1.0 V7 governance demo (lock+dispatch+audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: V7 v0.1 round-trip · 3 governance tools
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python examples/v7_governance_demo.py
