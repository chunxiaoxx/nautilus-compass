# compass v1.0 · nginx region routing config
# Status: 2026-05-05 · ready for v0.9.5+ multi-region deployment
#
# Deploy:
#   /etc/nginx/sites-available/compass.conf  (symlink to sites-enabled)
#   nginx -t && nginx -s reload
#
# Requires:
#   - lua-resty-jwt (for JWT region claim parsing) OR
#     mod-http-auth-jwt-module (nginx module · alternative)
#   - ssl certificates from Let's Encrypt (compass.nautilus.social
#     + cn.compass.nautilus.social + eu.compass.nautilus.social + us.compass.nautilus.social)

# Upstream pools per region
upstream compass_cn {
    least_conn;
    server cn-1.compass.internal:8000 max_fails=3 fail_timeout=30s;
    server cn-2.compass.internal:8000 max_fails=3 fail_timeout=30s backup;
    keepalive 32;
}

upstream compass_eu {
    least_conn;
    server eu-1.compass.internal:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream compass_us {
    least_conn;
    server us-1.compass.internal:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Map JWT region claim → upstream
map $jwt_region $compass_upstream {
    default       compass_cn;        # default to cn (mainland)
    cn-shanghai   compass_cn;
    eu-frankfurt  compass_eu;
    us-virginia   compass_us;
}

# Unified entry · routes by JWT region
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name compass.nautilus.social;

    ssl_certificate     /etc/letsencrypt/live/compass.nautilus.social/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/compass.nautilus.social/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS · 1 year · include subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Parse JWT region claim from Authorization header
    set $jwt_region "";
    access_by_lua_block {
        local jwt = require "resty.jwt"
        local auth = ngx.var.http_authorization or ""
        if auth:sub(1, 7) == "Bearer " then
            local token = auth:sub(8)
            -- IMPORTANT: replace with actual secret from env / vault
            local jwt_obj = jwt:verify(os.getenv("NAUTILUS_JWT_SECRET"), token)
            if jwt_obj.verified and jwt_obj.payload and jwt_obj.payload.region then
                ngx.var.jwt_region = jwt_obj.payload.region
            end
        end
    }

    # Health check (no auth · returns local region info)
    location = /healthz {
        proxy_pass http://compass_cn;  # always local (cn) for global health
        proxy_set_header Host $host;
        access_log off;
    }

    # Landing page (static)
    location = / {
        root /var/www/compass;
        index index.html;
    }

    # API endpoints · route by region
    location /v1/ {
        proxy_pass http://$compass_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Region $jwt_region;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        # CORS for nautilus.social subdomains
        add_header Access-Control-Allow-Origin "https://nautilus.social";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-User-ID, X-Agent-ID, X-Agent-Type";
    }

    # A2A endpoints · route by region (same logic)
    location /a2a/ {
        proxy_pass http://$compass_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Region $jwt_region;
    }

    # Rate limiting per IP (60/min default · adjust per plan via JWT)
    limit_req_zone $binary_remote_addr zone=compass_60:10m rate=60r/m;
    location /v1/observations {
        limit_req zone=compass_60 burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://$compass_upstream;
    }
}

# Region-specific subdomains (advanced users · skip global routing)
server {
    listen 443 ssl http2;
    server_name cn.compass.nautilus.social;
    ssl_certificate     /etc/letsencrypt/live/cn.compass.nautilus.social/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cn.compass.nautilus.social/privkey.pem;
    location / {
        proxy_pass http://compass_cn;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl http2;
    server_name eu.compass.nautilus.social;
    ssl_certificate     /etc/letsencrypt/live/eu.compass.nautilus.social/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eu.compass.nautilus.social/privkey.pem;
    location / {
        proxy_pass http://compass_eu;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl http2;
    server_name us.compass.nautilus.social;
    ssl_certificate     /etc/letsencrypt/live/us.compass.nautilus.social/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/us.compass.nautilus.social/privkey.pem;
    location / {
        proxy_pass http://compass_us;
        proxy_set_header Host $host;
    }
}

# HTTP → HTTPS redirect (all)
server {
    listen 80;
    listen [::]:80;
    server_name compass.nautilus.social cn.compass.nautilus.social
                eu.compass.nautilus.social us.compass.nautilus.social;
    return 301 https://$host$request_uri;
}
